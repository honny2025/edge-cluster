[package]
name = "edge-cluster-agent"
version = "0.5.0-m5"
edition = "2021"
description = "edge-cluster 节点 Agent（Rust 重写版，wire 协议与 v0.5.0-m5 Python 版一致）"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
chrono = "0.4"
ureq = "2.10"
fs4 = "1.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
opt-level = 3
strip = true
