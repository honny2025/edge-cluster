# 平台服务端配置。
# 所有可调项都在这里，且都能被环境变量覆盖（前缀 EDGE_，如 EDGE_SERVER__PORT=9000）。
# 默认值开箱即用，不需要改这个文件也能跑起来。

[server]
host = "0.0.0.0"                 # 监听地址
port = 8000                      # HTTP / WebSocket 端口
token = "edge-cluster-dev-token" # 共享 token（平台与 Agent 必须一致）
discovery_port = 37020           # UDP 广播发现端口
offline_threshold = 15           # 秒：心跳超时多久算离线
offline_confirm_times = 3        # 防抖：连续 N 次巡检都超时才标记 offline
heartbeat_interval = 5           # 秒：平台巡检周期（也是期望的 Agent 心跳间隔）
service_probe_interval = 15      # 秒：模型服务探活周期
metric_retention_days = 7        # 指标采样保留天数
metric_min_interval = 2          # 秒：同一节点两次入库指标的最小间隔（降采样保护）
log_level = "INFO"

[data]
db_path = "data/edge_cluster.db" # SQLite 文件
models_dir = "data/models"       # 上传的模型文件存放目录
logs_dir = "data/logs"           # 平台日志目录

[web]
serve_static = true              # 是否托管 web/dist 构建产物（单端口交付）

[alerts]
# 告警阈值（里程碑 2）。指标取不到（null）时一律不告警 —— 没有数据不等于异常。
enabled = true                   # 总开关
cpu_usage_warn = 85.0            # CPU 使用率 % ≥ 此值告警
mem_usage_warn = 85.0            # 内存使用率 % ≥ 此值告警
storage_usage_warn = 90.0        # 存储使用率 % ≥ 此值告警
temperature_warn = 45.0          # 温度 ℃ ≥ 此值告警
temperature_critical = 55.0      # 温度 ℃ ≥ 此值严重告警
alarm_on_offline = true          # 节点离线是否产生告警
probe_timeout_warn = 3           # 服务探活连续失败 N 次判定为 error（里程碑 4 用）
