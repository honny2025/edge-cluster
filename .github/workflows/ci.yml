name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # ① Rust 平台服务端：编译检查（rusqlite 用 bundled，无需系统 sqlite）
  # ---------------------------------------------------------------------------
  server-rust:
    name: Server (Rust) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server-rust/target
          key: server-rust-${{ hashFiles('server-rust/Cargo.lock') }}

      - name: Build (release)
        working-directory: server-rust
        run: cargo build --release --locked

  # ---------------------------------------------------------------------------
  # ② Rust 节点 Agent：编译检查
  # ---------------------------------------------------------------------------
  agent-rust:
    name: Agent (Rust) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node-agent-rust/target
          key: agent-rust-${{ hashFiles('node-agent-rust/Cargo.lock') }}

      - name: Build (release)
        working-directory: node-agent-rust
        run: cargo build --release --locked

  # ---------------------------------------------------------------------------
  # ③ Python 版 Agent（Termux 真机用）：语法检查
  # ---------------------------------------------------------------------------
  agent-python:
    name: Agent (Python) syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile Python sources
        run: python -m compileall -q node-agent tools docs/acceptance

  # ---------------------------------------------------------------------------
  # ④ 前端类型检查（不产出 dist，dist 是随包提交的）
  # ---------------------------------------------------------------------------
  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck
