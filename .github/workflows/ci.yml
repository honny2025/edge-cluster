name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # ① Python 静态检查 + 配置层自检（快，不用起服务）
  # ---------------------------------------------------------------------------
  server-config:
    name: Server static checks & config self-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Byte-compile all Python sources
        run: |
          python -m compileall -q server node-agent tools docs/acceptance

      - name: Config layer self-test (8 checks, no server needed)
        run: python docs/acceptance/config_check.py

  # ---------------------------------------------------------------------------
  # ② 端到端通信闭环验收（起平台 + 2 模拟节点，跑 M1/M2 断言）
  # ---------------------------------------------------------------------------
  acceptance:
    name: End-to-end acceptance (M1 + M2)
    runs-on: ubuntu-latest
    needs: server-config

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r node-agent/requirements.txt

      - name: Install frontend dependencies & build
        run: |
          cd web
          npm ci
          npm run build

      - name: Start platform
        run: |
          cd server
          nohup python run.py > /tmp/server.log 2>&1 &
          echo "waiting for platform..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/system/health > /dev/null; then
              echo "platform is up"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/system/health

      - name: Start 2 simulated nodes
        run: |
          cd node-agent
          nohup python agent.py --simulate --name phone-01 --platform-url http://127.0.0.1:8000 > /tmp/phone-01.log 2>&1 &
          nohup python agent.py --simulate --name phone-02 --platform-url http://127.0.0.1:8000 > /tmp/phone-02.log 2>&1 &
          echo "waiting for nodes to register..."
          for i in $(seq 1 30); do
            COUNT=$(curl -sf -H "X-Auth-Token: change-me-please" \
              http://127.0.0.1:8000/api/v1/nodes | python -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 2 ]; then
              echo "nodes registered: $COUNT"
              break
            fi
            sleep 1
          done

      - name: Milestone 1 acceptance (11 checks)
        run: python docs/acceptance/m1_check.py --phase online

      - name: Milestone 2 acceptance (17 checks)
        run: python docs/acceptance/m2_check.py --phase online

      - name: Platform log (always, for debugging)
        if: always()
        run: cat /tmp/server.log || true

      - name: Node logs (always, for debugging)
        if: always()
        run: |
          echo "===== phone-01 ====="
          cat /tmp/phone-01.log || true
          echo "===== phone-02 ====="
          cat /tmp/phone-02.log || true

  # ---------------------------------------------------------------------------
  # ③ 前端类型检查 + 构建
  # ---------------------------------------------------------------------------
  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Type check (must be zero errors)
        run: cd web && npm run typecheck

      - name: Build
        run: cd web && npm run build

      - name: Report bundle size
        run: |
          echo "=== dist ==="
          du -sh web/dist
          ls -lh web/dist/assets
